name: Deploy web (reusable)

# Called by cd-staging.yml (push develop) and cd-production.yml (push main).
#
#   gates (typecheck, lint, unit) -> build & push THIS environment's image
#   -> ship compose + deploy script -> SSH: pull by digest, label check,
#   swap, health on loopback + through nginx, auto-rollback on failure.
#
# Why a build per environment (unlike the API, which promotes one digest):
# Next inlines NEXT_PUBLIC_* into the client bundle at build time, so the API
# URL and site URL are part of the image bytes. See
# docs/sop/2026-11-06-fe-vps-deploy.md.
#
# Every host, port and URL comes from the GitHub Environment named by
# `environment` - nothing environment-specific is written in this repository.

on:
  workflow_call:
    inputs:
      environment:
        description: "staging | production"
        required: true
        type: string
      image_tag:
        description: "Redeploy an EXISTING tag (sha-<7>-<environment>) instead of building."
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  gates:
    name: Typecheck · Lint · Unit
    # A rollback redeploys bytes that already passed these gates.
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy:
    name: Build & deploy (${{ inputs.environment }})
    needs: [gates]
    # always() keeps the rollback path (gates skipped) alive; the explicit
    # checks stop a FAILED or cancelled gate from ever reaching the VPS.
    if: always() && needs.gates.result != 'failure' && needs.gates.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      # write: push the image. The same run token is forwarded to the VPS for a
      # short-lived `docker login` - no stored registry credential.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preflight - every secret and var is set
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_URL: ${{ vars.APP_URL }}
          WEB_PORT: ${{ vars.WEB_PORT }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          MISSING=""
          for v in VPS_HOST VPS_USERNAME VPS_SSH_KEY DEPLOY_PATH APP_URL WEB_PORT \
                   NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_SITE_URL; do
            [ -n "${!v:-}" ] || MISSING="${MISSING} ${v}"
          done
          if [ -n "${MISSING}" ]; then
            echo "::error::Unset for the '${ENVIRONMENT}' environment:${MISSING}. Nothing was built or shipped. See docs/sop/2026-11-06-fe-vps-deploy.md."
            exit 1
          fi
          printf '%s' "${WEB_PORT}" | grep -qE '^[0-9]{2,5}$' || { echo "::error::WEB_PORT must be a port number"; exit 1; }
          printf '%s' "${APP_URL}" | grep -qE '^https://[A-Za-z0-9.-]+/?$' || { echo "::error::APP_URL must be https://<host> with no path"; exit 1; }
          echo "All deploy inputs present."

      - name: Resolve names
        id: names
        env:
          REPO: ${{ github.repository }}
          ENVIRONMENT: ${{ inputs.environment }}
          APP_URL: ${{ vars.APP_URL }}
          MANUAL_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/$(printf '%s' "${REPO}" | tr '[:upper:]' '[:lower:]')"
          HOST="${APP_URL#https://}"; HOST="${HOST%/}"
          if [ -n "${MANUAL_TAG}" ]; then
            # The tag must name THIS environment's build: NEXT_PUBLIC_* values
            # are baked in, so a staging image in production would call the
            # staging API. The VPS re-checks the image label as well.
            if ! printf '%s' "${MANUAL_TAG}" | grep -qE "^sha-[a-f0-9]{7,40}-${ENVIRONMENT}\$"; then
              echo "::error::image_tag must look like sha-<commit>-${ENVIRONMENT}, got '${MANUAL_TAG}'"
              exit 1
            fi
          fi
          {
            echo "image=${IMAGE}"
            echo "tag=sha-${GITHUB_SHA::7}-${ENVIRONMENT}"
            echo "host=${HOST}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        if: inputs.image_tag == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            WEB_ENVIRONMENT=${{ inputs.environment }}
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web-${{ inputs.environment }}
          cache-to: type=gha,mode=max,scope=web-${{ inputs.environment }}

      - name: Pin the image by digest
        id: target
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          MANUAL_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_TAG}" ]; then
            DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${MANUAL_TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "Manual redeploy (rollback path) of ${IMAGE}:${MANUAL_TAG}"
          else
            DIGEST="${BUILT_DIGEST}"
          fi
          printf '%s' "${DIGEST}" | grep -qE '^sha256:[a-f0-9]{64}$' || { echo "::error::no valid digest resolved ('${DIGEST}')"; exit 1; }
          echo "image_ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${IMAGE}@${DIGEST}"

      - name: Ship compose file and deploy script
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || 22 }}
          source: "deploy/docker-compose.web.yml,deploy/web-deploy.sh"
          strip_components: 1
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          IMAGE_REF: ${{ steps.target.outputs.image_ref }}
          STACK_ENV: ${{ inputs.environment }}
          WEB_PORT: ${{ vars.WEB_PORT }}
          HEALTH_HOST: ${{ steps.names.outputs.host }}
          HEALTH_VIA_NGINX: ${{ vars.HEALTH_VIA_NGINX || 'true' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || 22 }}
          envs: IMAGE_REF,STACK_ENV,WEB_PORT,HEALTH_HOST,HEALTH_VIA_NGINX,DEPLOY_PATH,GHCR_USER,GHCR_TOKEN
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH}"
            bash ./web-deploy.sh

      - name: Summary
        if: always()
        env:
          IMAGE_REF: ${{ steps.target.outputs.image_ref }}
          TAG: ${{ inputs.image_tag || steps.names.outputs.tag }}
          ENVIRONMENT: ${{ inputs.environment }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### Web deploy (${ENVIRONMENT}): ${RESULT}"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| tag | \`${TAG}\` |"
            echo "| image | \`${IMAGE_REF:-<not resolved>}\` |"
            echo ""
            echo "Roll back: run this environment's CD workflow with \`image_tag\` = an earlier \`sha-<commit>-${ENVIRONMENT}\`."
          } >> "$GITHUB_STEP_SUMMARY"
